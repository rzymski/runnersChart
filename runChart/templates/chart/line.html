{% extends 'partials/base.html' %}

{% block content %}
<style>
    body.wrapper {
        grid-template-rows: minmax(0, 1fr) auto;
    }

    .myNavAndContent {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 0;
    }

    .myNavAndContent > header {
        flex: 0 0 auto;
    }

    .myNavAndContent > main {
        display: flex;
        flex: 1 1 auto;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
    }

    .line-chart-container {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;
        margin: 10px 12px 6px;
    }

    #myLineChart {
        display: block;
    }
</style>

<div class="line-chart-container">
    <canvas id="myLineChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    const runners = {{ runners|safe }};
    const labelTimes = {{ labels|safe }};
    const colors = {{ colors|safe }};
    const datasets = [];
    const runsData = {{ runsData|safe }};

    const flatLine = (ctx, value) => ctx.p0.parsed.y == ctx.p1.parsed.y ? value : undefined;

    for (let i = 0; i < runners.length; i++) {
        const backgroundColor = [colors[i % 30]];
        const borderColor = [colors[i % 30]];
        datasets.push({
            label: `${runners[i]}`,
            data: runsData[i],
            borderColor: borderColor,
            backgroundColor: backgroundColor,
            segment: {
                borderDash: ctx => flatLine(ctx, [4, 20]),
                label: ctx => flatLine(ctx, 'Super')
            }
        });
    }

    const ctx = document.getElementById('myLineChart').getContext('2d');
    const myLineChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labelTimes,
            datasets: datasets
        },
        options: {
            elements: {
                point: {
                    radius: 5
                }
            },
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    title: {
                        display: true,
                        text: 'Biegacze'
                    },
                    position: 'right'
                },
                title: {
                    display: true,
                    text: 'Wykres najlepszych biegaczy'
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'czas'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Liczba okrążeń'
                    },
                    min: 0,
                    ticks: {
                        stepSize: 1
                    },
                    suggestedMax: 4
                }
            }
        }
    });

    let linesVisible = true;
    function showHideLines() {
        const datasets = myLineChart.data.datasets;
        for (let i = 0; i < datasets.length; i++) {
            datasets[i].hidden = linesVisible;
        }
        myLineChart.update();
        linesVisible = !linesVisible;
    }
</script>
{% endblock %}
